services:
  - type: web
    name: aerocast-iot-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: readings and the model's step buffer live in process memory.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
